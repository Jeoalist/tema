[package]
name = "tema"
version = "0.1.1"
edition = "2024"
description = "Theme your whole Hyprland desktop from a single palette (GTK4 / libadwaita)"
license = "MIT"
repository = "https://github.com/Jeoalist/tema"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
toml_edit = "0.25"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
